<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser votre mot de passe - Wonjo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4A8896">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/wonjo-favicon.png">
<!--
  Page relais du lien de reinitialisation.

  Pourquoi elle existe : le lien de l'email ne peut pas pointer directement sur
  wonjo://reset-password. Un navigateur ne suit pas une navigation vers un
  scheme custom sans geste de l'utilisateur - la redirection 303 de GoTrue
  aboutissait a une page blanche. Le bouton ci-dessous EST ce geste.

  Le jeton voyage dans le FRAGMENT (#), jamais dans la query string : un
  fragment n'est pas transmis au serveur, il ne finit donc pas dans les logs
  d'acces de l'hebergement. Il n'est pas consomme ici non plus - c'est l'app
  qui l'echange contre une session (verifyOtp), de sorte qu'un scanner de
  liens de messagerie qui prefetche l'URL ne visite qu'une page statique et
  ne brule pas le lien avant l'utilisateur.
-->
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F8F7FF;
    color: #1A1A2E;
  }
  .card {
    text-align: center;
    padding: 32px 24px;
    max-width: 340px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  a.btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 14px;
    background: linear-gradient(90deg, #4A8896, #7D4E2E);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
  }
  .hint {
    font-size: 13px;
    color: #9CA3AF;
    margin: 20px 0 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="titre">Ouverture de Wonjo…</h1>
    <p id="texte">Appuyez sur le bouton ci-dessous pour choisir votre nouveau mot de passe dans l'application.</p>
    <a class="btn" id="btn" href="#">Ouvrir l'application</a>
    <p class="hint" id="astuce">Si rien ne se passe, ouvrez Wonjo depuis votre écran d'accueil et redemandez un lien.</p>
  </div>
<script>
(function () {
  // Le fragment est la source normale ; la query sert de repli si un client
  // mail reecrit l'URL et deplace les parametres.
  var brut = window.location.hash.replace(/^#/, '') || window.location.search.replace(/^\?/, '');
  var params = new URLSearchParams(brut);
  var tokenHash = params.get('token_hash');
  var type = params.get('type') || 'recovery';

  var titre = document.getElementById('titre');
  var texte = document.getElementById('texte');
  var btn = document.getElementById('btn');
  var astuce = document.getElementById('astuce');

  // GoTrue renvoie ses echecs sous forme d'erreur dans le fragment. Sans ce
  // cas, un lien perime relancait l'app pour rien et l'utilisateur restait
  // devant un ecran muet, sans savoir quoi faire.
  var erreur = params.get('error_description') || params.get('error');
  if (erreur || !tokenHash) {
    titre.textContent = erreur ? 'Lien expiré' : 'Lien incomplet';
    texte.textContent = erreur
      ? "Ce lien de réinitialisation n'est plus valable."
      : "Ce lien est incomplet. Il a peut-être été tronqué par votre messagerie.";
    btn.style.display = 'none';
    astuce.textContent = 'Ouvrez Wonjo, puis « Mot de passe oublié » pour recevoir un nouveau lien.';
    return;
  }

  // Fragment cote https (il ne part pas au serveur), QUERY cote wonjo:// : un
  // fragment n'a pas de destinataire serveur a proteger sur un scheme custom,
  // et il est moins surement transmis a l'app par l'OS que la query string.
  var lien = 'wonjo://reset-password?token_hash=' + encodeURIComponent(tokenHash)
           + '&type=' + encodeURIComponent(type);
  btn.setAttribute('href', lien);

  // Tentative automatique : elle aboutit sur les clients qui l'autorisent, et
  // echoue silencieusement ailleurs - d'ou le bouton, qui reste la vraie voie.
  window.location.href = lien;
})();
</script>
</body>
</html>
