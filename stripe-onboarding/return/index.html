<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retour vers Wonjo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4A8896">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/wonjo-favicon.png">
<meta http-equiv="refresh" content="0;url=wonjo://stripe-onboarding/return">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F8F7FF;
    color: #1A1A2E;
  }
  .card {
    text-align: center;
    padding: 32px 24px;
    max-width: 340px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  a.btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 14px;
    background: linear-gradient(90deg, #4A8896, #7D4E2E);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
</style>
<script>window.location.replace('wonjo://stripe-onboarding/return');</script>
</head>
<body>
  <div class="card">
    <h1>Configuration terminée</h1>
    <p>Vous allez être redirigé vers l'application Wonjo. Si rien ne se passe, appuyez sur le bouton ci-dessous.</p>
    <a class="btn" href="wonjo://stripe-onboarding/return">Revenir à l'application</a>
  </div>
</body>
</html>
