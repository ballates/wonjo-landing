name: Deploy Pages

# Remplace le mode "Deploy from a branch" de GitHub Pages : depuis l'ajout du
# back-office (SPA Vite dans backoffice/), il faut une etape de build avant
# publication, ce que "Deploy from a branch" ne sait pas faire.
#
# ETAPE MANUELLE REQUISE (une fois) : Settings -> Pages -> Source ->
# "GitHub Actions" (au lieu de "Deploy from a branch"). Sans ce changement,
# ce workflow tourne mais rien ne se publie.
#
# Le reste du site (index.html, cgu.html, admin/ Decap CMS...) est statique
# et n'a besoin d'aucun build - il est copie tel quel a cote du back-office
# compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Installer les dependances du back-office
        working-directory: backoffice
        run: npm ci

      - name: Construire le back-office
        working-directory: backoffice
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assembler le site a publier
        run: |
          mkdir -p _site
          # Tout le site statique existant, sans les sources non publiables.
          rsync -a --exclude='.git' --exclude='.github' --exclude='backoffice' --exclude='_site' \
            --exclude='node_modules' ./ _site/
          # Le back-office compile prend la place de son propre dossier source.
          mkdir -p _site/backoffice
          cp -r backoffice/dist/. _site/backoffice/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
